<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <!-- The renderer is served over the privileged app:// scheme; the CSP pins
       it to its own origin and forbids every other network destination. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none';" />
  <title>AgentKeeper</title>
  <!-- Applied before first paint so a dark-theme user never sees a white flash.
       Kept inline and tiny; CSP is script-src 'self' so this must be a file. -->
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AK</div>
        <div class="brand-text">
          <div class="brand-name">AgentKeeper</div>
          <div class="brand-sub" data-i18n="common.tagline"></div>
        </div>
        <!-- Collapses the sidebar to a 60px icon rail (app.js syncSideToggle).
             aria-expanded is kept truthful by the same function. -->
        <button class="icon-btn side-toggle" id="side-toggle" aria-controls="app"
                aria-expanded="true" aria-label="Collapse sidebar">«</button>
      </div>

      <nav class="nav" id="nav">
        <div class="nav-group" id="nav-group-overview">Overview</div>
        <button class="nav-item active" data-view="overview"><span class="nav-ico">◱</span><span class="nav-text">Dashboard</span></button>
        <button class="nav-item" data-view="assets"><span class="nav-ico">▤</span><span class="nav-text">Assets</span><span class="nav-badge" id="nav-asset-count">0</span></button>
        <button class="nav-item" data-view="agents"><span class="nav-ico">◈</span><span class="nav-text">Agents</span></button>
        <button class="nav-item" data-view="projects"><span class="nav-ico">▣</span><span class="nav-text">Projects</span></button>
        <button class="nav-item" data-view="discover"><span class="nav-ico">✦</span><span class="nav-text">Discover</span></button>
        <div class="nav-group" id="nav-group-operate">Operate</div>
        <button class="nav-item" data-view="health"><span class="nav-ico">✚</span><span class="nav-text">Health</span><span class="nav-badge warn" id="nav-issue-count">0</span></button>
        <button class="nav-item" data-view="activity"><span class="nav-ico">↺</span><span class="nav-text">Activity</span></button>
        <button class="nav-item" data-view="settings"><span class="nav-ico">⚙</span><span class="nav-text">Settings</span><span class="nav-badge warn hidden" id="nav-update-badge">!</span></button>
      </nav>

      <div class="side-foot">
        <div class="side-foot-note" id="store-root">store: —</div>
      </div>
    </aside>

    <main class="main">
      <div class="update-banner hidden" id="update-banner">
        <span id="update-text"></span>
        <button class="btn sm" id="update-open" data-i18n="update.open"></button>
        <button class="icon-btn" id="update-dismiss" aria-label="Dismiss" data-i18n-label="update.dismiss" data-i18n-title="update.dismiss">✕</button>
      </div>
      <div class="scanbar hidden" id="scanbar" aria-live="polite">
        <span class="spinner"></span><span id="scanbar-text"></span>
        <div class="scan-track"><div class="scan-fill"></div></div>
      </div>
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="view-title">Dashboard</h1>
          <p id="view-sub" data-i18n="nav.scanHint">Scanning agent assets…</p>
        </div>
        <div class="topbar-actions">
          <div class="search-wrap">
            <span class="search-ico" aria-hidden="true">⌕</span>
            <!-- A placeholder is not an accessible name: it disappears the
                 moment the field has content, and is not a label for AT. -->
            <input id="search" type="search" data-i18n-placeholder="assets.searchPlaceholder" placeholder="Filter by name, agent, tag…"
                   aria-label="Search assets" data-i18n-label="assets.searchLabel" autocomplete="off" />
            <kbd aria-hidden="true">/</kbd>
          </div>
          <button class="btn" id="btn-import" data-i18n="projects.import"></button>
          <button class="btn primary" id="btn-new-skill" data-i18n="assets.newSkill"></button>
          <button class="btn" id="btn-scan" data-i18n="nav.scan" data-i18n-title="nav.rescanTitle" title="Rescan all agent homes"></button>
        </div>
      </header>

      <section class="view" id="view-root">
        <!-- Language-neutral loading skeleton shaped like the dashboard it
             becomes: a row of stat cards, then two half-width list cards that
             fill the leftover height. The first real render replaces it
             wholesale. -->
        <div class="view-fill" aria-hidden="true">
          <div class="skl-stats">
            <div class="skl-stat"><div class="skeleton s1"></div><div class="skeleton s2"></div></div>
            <div class="skl-stat"><div class="skeleton s1"></div><div class="skeleton s3"></div></div>
            <div class="skl-stat"><div class="skeleton s1"></div><div class="skeleton s2"></div></div>
            <div class="skl-stat"><div class="skeleton s1"></div><div class="skeleton s3"></div></div>
          </div>
          <div class="row-fill col mt">
            <div class="flex-1-min card skl-panel">
              <div class="skeleton skl-head"></div>
              <div class="skl-item"><span class="skl-dot"></span><div class="skl-lines"><div class="skeleton s2"></div><div class="skeleton s3"></div></div></div>
              <div class="skl-item"><span class="skl-dot"></span><div class="skl-lines"><div class="skeleton s3"></div><div class="skeleton s2"></div></div></div>
              <div class="skl-item"><span class="skl-dot"></span><div class="skl-lines"><div class="skeleton s2"></div><div class="skeleton s1"></div></div></div>
            </div>
            <div class="flex-1-min card skl-panel">
              <div class="skeleton skl-head"></div>
              <div class="skl-item"><span class="skl-dot"></span><div class="skl-lines"><div class="skeleton s3"></div><div class="skeleton s3"></div></div></div>
              <div class="skl-item"><span class="skl-dot"></span><div class="skl-lines"><div class="skeleton s2"></div><div class="skeleton s3"></div></div></div>
              <div class="skl-item"><span class="skl-dot"></span><div class="skl-lines"><div class="skeleton s3"></div><div class="skeleton s1"></div></div></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="drawer-scrim" id="scrim"></div>
  <div class="ctxmenu" id="ctxmenu"></div>
  <!-- Dialog semantics live on the drawer itself: it is a modal surface while
       open (app.js traps Tab inside it and returns focus on close), so AT must
       be told what it is instead of discovering a bare <aside>. `inert` while
       closed keeps the off-screen ✕ out of the tab order without the
       aria-hidden-on-focusable-element error axe reports. -->
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true"
         aria-labelledby="drawer-title" tabindex="-1" inert>
    <div class="drawer-head">
      <div id="drawer-title" data-i18n="drawer.title"></div>
      <button class="icon-btn" id="drawer-close" aria-label="Close" data-i18n-label="common.close">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="modal-scrim" id="modal-scrim" aria-hidden="true">
    <div class="modal" id="modal" role="dialog" aria-modal="true"
         aria-labelledby="modal-title" tabindex="-1">
      <div class="modal-head"><span id="modal-title">Dialog</span><button class="icon-btn" id="modal-close" aria-label="Close" data-i18n-label="common.close">✕</button></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>

  <!-- One live region for every transient message: role=status implies
       aria-live=polite + aria-atomic, so toasts are announced without
       interrupting, and the 68 toast() call sites need no change. -->
  <div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <script src="engine-zh.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
