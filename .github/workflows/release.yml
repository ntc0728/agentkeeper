name: release

# 一个工作流，两种构建：
#
#   1. 推 tag（`git tag v0.3.0 && git push origin v0.3.0`）→ 正式发布。
#      版本号取自 tag；只有 beta/rc/alpha 才算预发布。
#      安装包与便携包都挂在这个 Release 上。
#   2. 推 main → 只构建。同一个安装包会产出并作为工作流产物上传，但不发布任何东西：
#      以前每次推 main 都会在 Releases 页上多一条 `v<版本>-ci.<run>` 预发布，把真正
#      的版本埋在 CI 噪音下面（应用内更新器本来就不看预发布，所以那些纯属杂物）。
#      真要某个提交的产物，从该次运行的 Artifacts 区块下载。
#
# 应用内更新器实际消费什么（见 docs/UPDATE.md）：
#   GET /repos/{repo}/releases/latest  ->  从 `assets[]` 里挑一条
# 由 `core/update/version.rs::pick_installer` 挑：win32 上要
#   *.exe  ·  不能是 `-portable`/压缩包/`-win|-web|-linux|-mac`  ·  文件名要匹配
#   /setup|install/  ·  再要求名字里含 `updateAssetKeyword`（"AgentKeeper"）。
# `AgentKeeper_0.2.0_x64-setup.exe` 全都满足，所以**安装包本身就是发布载荷** ——
# 不需要 `latest.yml`，也不需要 `.blockmap`。
#
# tag 构建的发布说明不是 GitHub 生成的：这个仓库从不发 PR，`generate_release_notes`
# 每次只产出一行（"Full Changelog: compare/v0.2.0...v0.2.1"），而应用内更新面板显示的
# 正是这一行。tag 构建改为渲染 `changelog/next.json`（`scripts/changelog.js render`，
# 见 docs/CHANGELOG.md），记录为空时直接失败 —— 不会发出一个没人看得懂的版本。
# main 构建仍用自动生成的说明：它只是 CI 产物，不是要让人读懂的发布。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 同一个 ref 同时只跑一次发布构建。连推 main 会把被取代的运行取消掉，而不是排成
# 五个 15 分钟的队；tag 构建永远不会被后来的推送取消（发布中断比发布晚更糟）。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node 在这里只有一件事：从 src/renderer 生成 tauri-shell/dist。
      # copy-frontend.js 零依赖，所以不需要 `npm ci` —— package.json 本来就一个依赖都没有。
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # i18n 关卡，必须在构建任何东西之前跑：Rust 引擎要显示到屏幕上的每一句话，
      # 都必须在 src/renderer/engine-zh.js 里有对应的中文。在这里发现一句没翻译的，
      # 代价是重跑一次；发版之后才发现，代价是中文界面里冒出一句英文。
      # `npm run` 只是个启动器 —— package.json 没有东西要装，这个 job 里也刻意
      # 不跑 `npm ci`。
      - name: Check Rust engine i18n coverage
        run: npm run tauri:i18n

      # tauri-shell/dist 被 git 忽略，所以全新 checkout 出来的前端是空的，
      # `cargo tauri build` 会打出一个空应用。在这里重新生成，同时也保证可执行文件
      # 里带的是这次提交对应的渲染层，而不是某份过期的本地副本。
      - name: Generate the frontend bundle
        run: node tauri-shell/copy-frontend.js

      # 把 tag 里的版本号盖进这次构建。
      #
      # 这不是表面功夫。`UpdateManager::app_version` 取的是
      # `env!("CARGO_PKG_VERSION")`（core/update/manager.rs:560），更新器拿它跟发布
      # tag 比对来决定「有没有新版本」。要是随 Cargo.toml 写什么就用什么，每个安装
      # 报告的版本号永远一样，更新器就会在每次检查时又把用户刚装过的那个版本推一遍。
      # 盖版本同时也让安装包文件名带上正在发布的版本号。
      #
      # `workflow_dispatch` 触发的运行，`github.ref_name` 里是分支名（`main`）而不是
      # 版本号，所以不是 `vX.Y.Z` 形式的 ref 就沿用代码树里已有的版本号。
      - name: Stamp the release version
        id: stamp
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/stamp-version.js" <<'NODE'
          const fs = require('fs');
          const confPath = 'tauri-shell/src-tauri/tauri.conf.json';
          // Both workspace members carry the version: the shell reports it in
          // the UI, and the core reports it in the MCP server's serverInfo.
          // A release where they disagree is a release where the agent and the
          // GUI report different versions of the same program.
          const cargoPaths = [
            'tauri-shell/src-tauri/Cargo.toml',
            'tauri-shell/core/Cargo.toml',
          ];
          const ref = process.env.REF_NAME || '';
          const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
          const current = conf.version;
          const m = /^v(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$/.exec(ref);
          if (!m) {
            console.log(`ref ${JSON.stringify(ref)} is not a vX.Y.Z tag — keeping ${current}`);
            // main pushes have no version in the ref; the tree version feeds
            // the synthetic release tag `v<version>-ci.<run_number>`.
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${current}\n`);
            process.exit(0);
          }
          const version = m[1];
          if (version === current) {
            console.log(`release version: ${version} (already in the tree)`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
            process.exit(0);
          }
          conf.version = version;
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');
          for (const cargoPath of cargoPaths) {
            // First `version = "…"` in Cargo.toml is `[package] version`.
            const cargo = fs.readFileSync(cargoPath, 'utf8');
            const patched = cargo.replace(/^(version = )"[^"]*"/m, `$1"${version}"`);
            if (patched === cargo) {
              console.error(`could not patch [package] version in ${cargoPath}`);
              process.exit(1);
            }
            fs.writeFileSync(cargoPath, patched);
          }
          console.log(`release version: ${current} -> ${version}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
          node "$RUNNER_TEMP/stamp-version.js"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-shell -> target

      # 这里刻意用 `cargo tauri build` 而不是 tauri-apps/tauri-action@v0：
      #   - tauri-action 会自动去跑它找到的那个 package.json 的包管理器 —— 这条流水线
      #     既不需要也不想要这一步；
      #   - 在一条要发布二进制的流水线里挂一个浮动的 `@v0` 标签；
      #   - 这个 job 本来就得在构建前先跑自己的步骤（生成前端、盖版本号），
      #     写哪种写法都是这么多 YAML。
      # `^2` 加 `--locked` 把 CLI 钉在发版时验证过的那个版本上。
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # MCP 服务与无界面扫描器在 `agentkeeper-core` 这个 crate 里，不在 Tauri 的
      # crate 里。`cargo tauri build` 只收集它自己构建的那个 crate 的二进制，看不到
      # 它们；`bundle.externalBin` 就是把别处的二进制带进安装包的办法。
      #
      # 这一步没有循环依赖。以前有过：那时 sidecar 是 Tauri crate 自己的 `[[bin]]`
      # 目标，而 `tauri-build` 会作为那个 crate 的构建脚本对每个 target 都跑一遍，
      # 于是干净的 target/ 根本构建不出构建脚本坚持「已经存在」的 sidecar。core crate
      # 没有构建脚本，所以它由一个不在意这些的东西来构建。暂存的文件落在
      # `tauri-shell/src-tauri/binaries/`，`bundle.externalBin` 就是按这个路径找的。
      - name: Stage the core binaries
        working-directory: tauri-shell
        run: node stage-core-bins.js

      # 不加 `--target`：runner 的宿主三元组本来就是 x86_64-pc-windows-msvc，
      # 保持默认 target 能让产物落在 target/release/ 下，跟这个仓库里其他构建一致。
      - name: Build the NSIS installer
        working-directory: tauri-shell/src-tauri
        run: cargo tauri build

      # 把构建留下的东西清掉，然后证明它确实没了。
      #
      # `target/` 在这里既不缓存也不上传，所以这不是为了 CI 磁盘 —— 这是唯一能把
      # 规则*强制执行*而不是靠人记住的地方。一次 `cargo build` 会留下约 180 MB 的
      # 构建脚本 .pdb，外加每次改 Cargo.toml 留下的孤儿构建目录；本地在什么都没失败
      # 之前就到过 7.9 GB。下一次失败的是 `tree` 关卡。
      # 必须在「Collect artefacts」之前跑：clean-build.js 只碰 pdb / build /
      # incremental，绝不碰打好的安装包。
      - name: Trim build tree
        run: node tauri-shell/clean-build.js --apply

      - name: Verify the build tree is clean
        run: node scripts/check.js tree

      - name: Collect artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-artifacts
          shopt -s nullglob
          exe=(tauri-shell/target/release/bundle/nsis/*.exe)
          if [ ${#exe[@]} -eq 0 ]; then
            echo "::error::no NSIS installer under tauri-shell/target/release/bundle/nsis"
            exit 1
          fi
          cp "${exe[@]}" dist-artifacts/

          # 便携包由 README 里写的同一个脚本构建，所以 CI 与本地跑法不会走偏。
          # `--no-build`：安装包上面刚构建过，在这里再跑一次 `cargo tauri build`
          # 只是花几分钟产出同一个二进制。
          #
          # 发布这个 zip 对应用内更新器是安全的：`pick_installer` 会两次拒绝它 ——
          # `-?portable\b` 和 `.zip` 压缩包规则（core/update/version.rs 的
          # asset_patterns）。只有 NSIS 安装包会进入竞争。
          node scripts/package-release.js --no-build
          cp release/*.zip dist-artifacts/
          ls -l dist-artifacts

      # 人写的改动记录成为发布正文。这一步在发布之前跑，记录为空或格式不对就
      # 让任务失败：说明只有一行「Full Changelog: compare/…」的发布谁也读不懂，
      # 而应用内更新面板显示的正是这段文字。
      - name: Render the release notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/changelog.js render --version "${{ github.ref_name }}" > dist-artifacts/release-notes.md
          cat dist-artifacts/release-notes.md

      - name: Publish to the Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # 没有名字的发布，在仓库侧栏里只显示成一个光秃秃的 tag（"1 tag"），
          # exe/zip 还得点进去才看得到。给它起名字，侧栏这一条才像个发布。
          name: ${{ format('AgentKeeper {0}', github.ref_name) }}
          # 推 tag 的构建会挂到 GitHub 为这个 tag 建好的发布上。
          tag_name: ${{ github.ref_name }}
          body_path: dist-artifacts/release-notes.md
          draft: false
          # tag 构建沿用 beta/rc/alpha 的预发布命名。
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          # 如果 NSIS 安装包或便携包没进到 dist-artifacts/，就让任务失败，而不是
          # 发一个看着完整、实际什么都没带的发布。（这一步创建的 tag 不会因为之后的
          # 失败而消失，所以「静默」在这里是最糟的结果。）
          fail_on_unmatched_files: true
          files: |
            dist-artifacts/*.exe
            dist-artifacts/*.zip

      # 推 main 的构建到此为止：产物进这次运行，不进 Releases 页。只有 tag 才发布
      # （见文件头）。
      - uses: actions/upload-artifact@v4
        with:
          name: agentkeeper-windows-x64
          path: dist-artifacts/
          retention-days: 30
