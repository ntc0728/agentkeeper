name: release

# TWO release channels, one workflow:
#
#   1. tag push (`git tag v0.3.0 && git push origin v0.3.0`)  → FINAL release.
#      Version is stamped from the tag; prerelease only for beta/rc/alpha.
#   2. push to main → CI PRERELEASE `v<tree-version>-ci.<run_number>`.
#      Every commit lands on the Releases page, but as a Pre-release: the
#      in-app updater's stable channel reads `/releases/latest`
#      (core/update/manager.rs:1110), which GitHub serves EXCLUDING
#      prereleases — so a CI build can never hijack a stable user's
#      "check for updates". The `-ci.N` suffix parses as a prerelease
#      segment (core/update/version.rs:26) and sorts BELOW the tree
#      version, so once v0.2.0 ships it outranks every 0.2.0-ci.* build.
#
# What the in-app updater actually consumes (see docs/UPDATE.md):
#   GET /repos/{repo}/releases/latest  ->  pick one entry of `assets[]`
# via `core/update/version.rs::pick_installer`, which on win32 wants
#   *.exe  ·  not `-portable`/archive/`-win|-web|-linux|-mac`  ·  name matching
#   /setup|install/  ·  then `updateAssetKeyword` ("AgentKeeper") in the name.
# `AgentKeeper_0.2.0_x64-setup.exe` satisfies all of that, so **the installer
# alone is the release payload** — no `latest.yml`, no `.blockmap`.
#
# Release notes are NOT generated by GitHub for tag builds: this repository
# never opens pull requests, so `generate_release_notes` produced exactly one
# line ("Full Changelog: compare/v0.2.0...v0.2.1") on every release, and that
# line is what the in-app update panel showed. A tag build renders
# `changelog/next.json` instead (`scripts/changelog.js render`, see
# docs/CHANGELOG.md) and FAILS when the record is empty, so a release cannot go
# out with nothing to read. A `main` build keeps the generated notes: it is a
# CI artefact, not a release anybody is asked to understand.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# One release build at a time per ref. A burst of main pushes cancels the
# superseded runs instead of queueing five 15-minute builds; a tag build is
# never cancelled by a later push (an interrupted release is worse than a
# late one).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node has exactly one job: generating tauri-shell/dist from
      # src/renderer. copy-frontend.js has zero dependencies, so there is no
      # `npm ci` — package.json carries no dependencies at all.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # i18n gate, before anything is built: every sentence the Rust engine
      # puts on screen must have a zh mapping in src/renderer/engine-zh.js.
      # An untranslated sentence found here costs a re-run; found after the
      # release it costs an English string in a Chinese UI.
      # `npm run` is only a launcher — package.json has nothing to install and
      # there is deliberately no `npm ci` in this job.
      - name: Check Rust engine i18n coverage
        run: npm run tauri:i18n

      # tauri-shell/dist is git-ignored, so a fresh checkout has no frontend at
      # all and `cargo tauri build` would bundle an empty app. Regenerating
      # here also guarantees the executable carries the renderer as of this
      # commit, not a stale local copy.
      - name: Generate the frontend bundle
        run: node tauri-shell/copy-frontend.js

      # Stamp the tag's version into the build.
      #
      # Not cosmetic. `UpdateManager::app_version` is `env!("CARGO_PKG_VERSION")`
      # (core/update/manager.rs:560) and is compared against the release tag to
      # decide "is there an update". Left at whatever Cargo.toml says, every
      # install reports the same version forever and the updater re-offers the
      # release the user just installed, on every check. Stamping also makes
      # the installer name carry the version being released.
      #
      # A `workflow_dispatch` run has a branch name in `github.ref_name`
      # (`main`), not a version, so a non-`vX.Y.Z` ref keeps the version that
      # is already in the tree.
      - name: Stamp the release version
        id: stamp
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/stamp-version.js" <<'NODE'
          const fs = require('fs');
          const confPath = 'tauri-shell/src-tauri/tauri.conf.json';
          // Both workspace members carry the version: the shell reports it in
          // the UI, and the core reports it in the MCP server's serverInfo.
          // A release where they disagree is a release where the agent and the
          // GUI report different versions of the same program.
          const cargoPaths = [
            'tauri-shell/src-tauri/Cargo.toml',
            'tauri-shell/core/Cargo.toml',
          ];
          const ref = process.env.REF_NAME || '';
          const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
          const current = conf.version;
          const m = /^v(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$/.exec(ref);
          if (!m) {
            console.log(`ref ${JSON.stringify(ref)} is not a vX.Y.Z tag — keeping ${current}`);
            // main pushes have no version in the ref; the tree version feeds
            // the synthetic release tag `v<version>-ci.<run_number>`.
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${current}\n`);
            process.exit(0);
          }
          const version = m[1];
          if (version === current) {
            console.log(`release version: ${version} (already in the tree)`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
            process.exit(0);
          }
          conf.version = version;
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');
          for (const cargoPath of cargoPaths) {
            // First `version = "…"` in Cargo.toml is `[package] version`.
            const cargo = fs.readFileSync(cargoPath, 'utf8');
            const patched = cargo.replace(/^(version = )"[^"]*"/m, `$1"${version}"`);
            if (patched === cargo) {
              console.error(`could not patch [package] version in ${cargoPath}`);
              process.exit(1);
            }
            fs.writeFileSync(cargoPath, patched);
          }
          console.log(`release version: ${current} -> ${version}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
          node "$RUNNER_TEMP/stamp-version.js"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-shell -> target

      # `cargo tauri build` is used instead of tauri-apps/tauri-action@v0 on
      # purpose:
      #   · tauri-action auto-runs the package manager of whatever package.json
      #     it finds — a step this pipeline neither needs nor wants;
      #   · it is a floating `@v0` tag in a pipeline that publishes binaries;
      #   · this job needs to run its own steps before the build anyway
      #     (frontend generation, version stamp), which is the same amount of
      #     YAML either way.
      # `^2` + `--locked` pins the CLI the release was verified with.
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # The MCP server and the headless scanner live in the `agentkeeper-core`
      # crate, not in the Tauri crate. `cargo tauri build` collects binaries
      # from the crate it builds, so it cannot see them; `bundle.externalBin`
      # is how a binary from elsewhere gets shipped.
      #
      # This step is NOT circular. It was, when the sidecars were `[[bin]]`
      # targets of the Tauri crate itself: `tauri-build` runs as that crate's
      # build script for every target, so a clean target/ could not build a
      # sidecar the build script insisted already existed. The core crate has
      # no build script, so it is built by something that does not care.
      #
      # The staged files land in `tauri-shell/src-tauri/binaries/`, which is
      # what `bundle.externalBin` resolves against.
      - name: Stage the core binaries
        working-directory: tauri-shell
        run: node stage-core-bins.js

      # No `--target`: the runner's host triple is already
      # x86_64-pc-windows-msvc, and keeping the default target puts the bundle
      # under target/release/ like every other build in this repo.
      - name: Build the NSIS installer
        working-directory: tauri-shell/src-tauri
        run: cargo tauri build

      # Trim what the build left behind, then prove it is gone.
      #
      # `target/` is never cached or uploaded here, so this is not about CI
      # disk -- it is the only place the rule can be *enforced* rather than
      # remembered. A `cargo build` leaves ~180 MB of build-script .pdb plus an
      # orphaned build dir per Cargo.toml change; locally that reached 7.9 GB
      # before anything failed. The `tree` gate is what fails next time.
      #
      # Runs BEFORE "Collect artefacts": clean-build.js only touches pdb /
      # build / incremental and never the bundled installer.
      - name: Trim build tree
        run: node tauri-shell/clean-build.js --apply

      - name: Verify the build tree is clean
        run: node scripts/check.js tree

      - name: Collect artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-artifacts
          shopt -s nullglob
          exe=(tauri-shell/target/release/bundle/nsis/*.exe)
          if [ ${#exe[@]} -eq 0 ]; then
            echo "::error::no NSIS installer under tauri-shell/target/release/bundle/nsis"
            exit 1
          fi
          cp "${exe[@]}" dist-artifacts/

          # The portable zip is built by the same script the README documents,
          # so CI and a local run cannot drift. `--no-build`: the installer was
          # just built above, and re-running `cargo tauri build` here would
          # spend minutes producing the same binary.
          #
          # Publishing the zip is safe for the in-app updater: `pick_installer`
          # rejects it twice over — `-?portable\b` and the `.zip` archive pattern
          # (core/update/version.rs asset_patterns). Only the NSIS setup competes.
          node scripts/package-release.js --no-build
          cp release/*.zip dist-artifacts/
          ls -l dist-artifacts

      # The human-written record becomes the release body. Runs BEFORE the
      # publish step and fails the job on an empty/invalid record: a tag whose
      # notes are "Full Changelog: compare/…" is a release nobody can read, and
      # the in-app update panel shows exactly this text.
      - name: Render the release notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/changelog.js render --version "${{ github.ref_name }}" > dist-artifacts/release-notes.md
          cat dist-artifacts/release-notes.md

      - name: Publish to the Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # A release WITHOUT a name is displayed in the repo sidebar as a bare
          # tag ("1 tag"), and the exe/zip only appear after clicking through.
          # Naming it is what makes the sidebar entry read as a release.
          name: ${{ format('AgentKeeper {0}', github.ref_name) }}
          # Tag-push builds attach to the release GitHub creates for the tag.
          tag_name: ${{ github.ref_name }}
          body_path: dist-artifacts/release-notes.md
          draft: false
          # Tag builds follow the beta/rc/alpha naming.
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          # If the NSIS installer or the portable zip did not reach
          # dist-artifacts/, fail the job instead of publishing a release that
          # looks complete and carries nothing. (A tag created by this step
          # survives a later failure, so silence here is the worst outcome.)
          fail_on_unmatched_files: true
          files: |
            dist-artifacts/*.exe
            dist-artifacts/*.zip

      # A main-push build is a CI artefact: generated notes are enough, and it
      # is ALWAYS a prerelease — that is what keeps it out of /releases/latest
      # and away from stable-channel updaters (see header).
      - name: Publish to the Release (CI build)
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ format('AgentKeeper {0} — CI build {1}', steps.stamp.outputs.version, github.run_number) }}
          # A main-push build gets a synthetic tag `v<version>-ci.<run>`.
          # Version source, in order: the vX.Y.Z ref, else the tree
          # (stamp-version printed which one applied).
          tag_name: ${{ format('v{0}-ci.{1}', steps.stamp.outputs.version, github.run_number) }}
          draft: false
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist-artifacts/*.exe
            dist-artifacts/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: agentkeeper-windows-x64
          path: dist-artifacts/
          retention-days: 30
