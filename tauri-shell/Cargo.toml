# AgentKeeper 的 Rust 工作区。
#
# 两个 crate，按代码本来就已经划好的界线拆：
#
#   core/       资产内核 —— 扫描、校验、存储、MCP 服务。
#               不依赖 Tauri，所以由它构建的无界面二进制（`agentkeeper-mcp`、
#               `ak-scan`）只链接 GUI 依赖图的一小部分，也只需承担一小部分
#               fat-LTO 时间。
#   src-tauri/  Tauri 桌面外壳 —— 命令、窗口、更新器接线。
#               依赖 core；core 不依赖任何东西。
#
# 有了这条界线，「内核永远看不到 Tauri 类型」才是编译器的保证，而不只是一句约定。
[workspace]
members = ["core", "src-tauri"]
resolver = "2"

# ---------------------------------------------------------------------------
# release profile 写在这里，不是 `src-tauri/Cargo.toml`。
#
# `[profile.*]` 只对被声明的那份清单生效。core 拆成独立 crate 之后，若把
# profile 写在 src-tauri 里，无界面二进制就会按 cargo 默认值构建 —— opt-level 0、
# 不做 LTO、不 strip —— 最终发布出去的文件大 50% 且未经优化。工作区根的 profile
# 对所有成员生效。
# ---------------------------------------------------------------------------

# 两个 profile，各管一件事。怎么选用见 docs/BUILDING.md。
#
# `[profile.release]` 负责**出包**：为产物体积优化。
# `[profile.dev]` 负责**迭代**：为你等的时间优化。
# 它们刻意是两个 profile —— 一个 profile 没法同时干这两件事。
#
# 在 16 线程台式机上，改一行外壳自己的源码并全量重编的实测结果：
#
#   lto = true,  codegen-units = 1    →  212 s     （fat LTO，单个 codegen 单元）
#   lto = false, codegen-units = 16   →   68 s     （本文件的设置）
#
# fat LTO 会对工作区里的**每一个**二进制重跑一遍跨 crate 优化，而
# `codegen-units = 1` 又把 LLVM 钉在单线程上做这件事。代价是产物体积：
# 外壳从 10.4 MiB 涨到约 12.5 MiB（+20%），安装包从 3.63 MiB 涨到约 4.0 MiB。
#
# 这个交换值得做，因为 release profile 现在只用来**出安装包**，不是每次保存都跑。
# 日常迭代走 `[profile.dev]`，约 8 s。详见 docs/BUILDING.md。
[profile.release]
codegen-units = 16
lto = false
opt-level = "s"
# `panic = "abort"` 曾经为了体积放在这里，现在去掉了：MCP 服务依赖
# `catch_unwind`。在 `abort` 下一个工具处理函数里的 `unwrap()` 就会杀掉整个
# stdio 进程，Agent 看到的是传输断开，而不是一条错误。unwind 表要几百 KB，
# 服务直接死掉丢的是功能本身。
panic = "unwind"
strip = true

# 出包体积不是唯一要考虑的事：release 构建还要保证各成员之间的体积**可复现**。
# `codegen-units = 16` 让 core 的两个二进制能与外壳并行链接，而不是排队等它。
#
# 如果将来某次改动又让产物明显变大，可用的杠杆是 `lto = "thin"`
# （比 `false` 慢、比 `true` 小 —— 同样的重编实测 138 s 对 68 s），
# 而不是退回 fat LTO。

# ---------------------------------------------------------------------------
# `debug` / `test` 构建只为跑 `cargo test` 与 `cargo check` 而存在。
# 默认 profile 会给约 400 个依赖 crate 保留完整 LLVM debuginfo，外加一份增量缓存，
# 合计 7.4 GB —— 是真正发布的那棵 release 树的 2.5 倍。这个项目没人用原生调试器
# 单步，所以：
#   - 自己的 crate 保留行号表（panic 信息仍能显示 file:line）
#   - 依赖完全去掉 debuginfo（体积大头在它们身上）
#   - 关掉 incremental：它的缓存让目录翻倍，只有在一个会话里反复小改才划算，
#     而那不是这里的工作方式
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = false

# build script 及其依赖默认会按 dev profile 另编一套（宿主侧），与目标侧的
# release 产物互不复用。tauri-build 需要跑 build script，于是 tauri-utils / syn /
# serde / regex 等同时出现在两条链上，各编一份。实测 tauri-utils 两份的 feature
# 完全相同（[brotli, compression, resources, walkdir]），体积 50.0 MB 对
# 25.9 MB，差异只来自 profile。
#
# 效果（干净 release 构建实测）：宿主侧依赖的 debuginfo 被剥掉，
# release 树从 1791 MB 降到 1396 MB（-22%）。
#
# 仍未消除的部分，别指望这一段能解决：
#   · build/ 下仍会留 100 个 build_script_build-*.pdb（约 107 MB）。cargo 对
#     build script 自身产物的 pdb 不受 build-override 的 strip 约束。
#   · .rlib 695 MB + .rmeta 381 MB 是依赖编译的必需产物，成对存在，不能删。
# opt-level 保持默认，避免改变 build script 自身的执行行为。
[profile.release.build-override]
debug = 0
strip = "symbols"
