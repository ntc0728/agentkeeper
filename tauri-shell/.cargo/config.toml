# 这个工作区关掉增量编译，写在真正生效的那一层配置里。
#
# `Cargo.toml` 里已经写了 `[profile.dev] incremental = false`，但那个键是三个
# 可写位置里**最弱**的一个。在 cargo 1.99.1 上用 6 组组合实测：只要配置链上任何
# 一处存在 `[build] incremental`，它在两个方向上都压过 `[profile.*] incremental`
# —— 一个全局的 `true` 会在 profile 写明 `false` 的情况下悄悄重新打开增量编译，
# 配置里的 `true` 同样能覆盖 profile 里的 `false`。
#
# 本机的 `~/.cargo/config.toml` 带着 `[build] incremental = true`（当初给所有项目
# 写的），这就是较早的 `target/` 树里长出 629 MB（debug）与 2.5 GB（release）增量
# 缓存的原因，尽管 profile 要求不要。注意键名的区别：在这里写
# `[profile.dev] incremental = false` **没有用**，只有 `[build]` 才行。
#
# 项目级 `.cargo/config.toml` 的优先级高于用户主目录那份，所以这个文件只为本工作区
# 钉住取值，不去改一个别的 Rust 项目可能正当地依赖着的机器级设置。
#
# cargo 是**从当前工作目录向上**找这个文件的，不是从 `--manifest-path` 找。因此它
# 必须放在工作区根（`tauri-shell/`），而不能放进某个成员目录里：现在的构建脚本
# 既有以 `tauri-shell/` 为工作目录跑的（scripts/package-release.js、
# tauri-shell/stage-core-bins.js），也有以 `tauri-shell/src-tauri` 为工作目录跑的
# （发布工作流），只有根目录这一份能同时被两边找到。
#
# 逃生出口：如果某次构建确实需要缓存，设 `CARGO_INCREMENTAL=1` 即可覆盖本文件
# （环境变量优先级高于配置）。用完记得取消 —— 注意 `CARGO_INCREMENTAL` 只认字面量
# `0` 和 `1`，写成 `true` 或把变量名拼错都会被静默忽略。
[build]
incremental = false
