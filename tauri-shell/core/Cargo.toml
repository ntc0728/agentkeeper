[package]
name = "agentkeeper-core"
version = "0.2.4"
description = "AgentKeeper asset core: scanning, validation, store, MCP server — no Tauri dependency"
authors = ["AgentKeeper"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

# 内核只是库。需要它的二进制各自声明依赖；没有一个会从这里继承到 Tauri 依赖，
# 因为这里本来就没有。这个分离正是拆 crate 的意义：无界面的 `agentkeeper-mcp` 与
# `ak-scan` 不应把 WebView 那一套拖进链接产物，而内核正是它们与 GUI 共享的部分。
[lib]
name = "agentkeeper_core"
path = "src/lib.rs"
crate-type = ["rlib"]

# Agent 启动的 stdio MCP 服务。与 GUI 用同一批 `core::` 模块 —— 另写一份写入路径
# 迟早会走偏，而从 Agent 的视角看，这条路径就是唯一的写入路径。GUI 通过
# `agentkeeper-shell` 对本 crate 的依赖到达同一批模块。
[[bin]]
name = "agentkeeper-mcp"
path = "src/bin/agentkeeper-mcp.rs"

# 无界面扫描器：与 GUI 相同的 `core::scan`，只是没有窗口，方便在 shell 里对扫描
# 结果做 diff。
[[bin]]
name = "ak-scan"
path = "src/bin/ak-scan.rs"

[dependencies]
# preserve_order 保留 frontmatter 里键的原始顺序，这样技能的元数据面板不会把字段
# 重排。
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# preserve_order 关系到对齐：`@iarna/toml` 保留键的插入顺序，而 `meta.envKeys`
# 把这个顺序暴露给界面。
toml = { version = "0.8", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
rayon = "1"
# 安全规则的匹配式不用反向引用、也不用环视，所以 `regex` 足以覆盖全部。
regex = "1"
# 整棵树里唯一的网络客户端：一个小的阻塞式实现（rustls + 系统根证书，不带异步
# 运行时）就够覆盖发现与更新两条 HTTP 链路，不必为了读一份 JSON 把 tokio 拖进来。
#
# `native-certs` 是**必需**的，不是为了好看：ureq 默认只信任它内置的那份 webpki
# 根证书清单，而任何装了企业代理 / 杀软 TLS 拦截的机器都多一条自己的根证书，
# 内置清单里没有它，于是每次 HTTPS 都失败在
#   TLS failed (invalid peer certificate: UnknownIssuer)
# —— 浏览器发同一个请求却是通的，因为它读系统证书库。用户看到的就是「检查更新
# 失败：cannot reach the server: TLS failed …」，一条无法据以行动的报错。
# 打开这个 feature 之后信任锚换成操作系统的证书库（Windows 证书存储区 /
# /etc/ssl/certs / Keychain），与浏览器同一套信任链。这不是给某个域名开洞，
# 也没有关掉证书校验。
ureq = { version = "2", features = ["json", "native-certs"] }
# 更新令牌的 `enc1:` 信封（DPAPI 密文的 base64），以及生成它所需的 Win32 调用。
# 令牌用 DPAPI 以用户作用域、无附加熵封装，所以同一用户的密文可以互换使用。
base64 = "0.22"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
