[package]
name = "agentkeeper-shell"
version = "0.2.2"
description = "AgentKeeper desktop shell (Tauri 2)"
authors = ["AgentKeeper"]
edition = "2021"
rust-version = "1.77"
# The GUI binary — the ONLY binary in this crate. `cargo tauri build` refuses to
# guess which of a crate's binaries is the app, and picking wrong silently
# ships a CLI instead of the shell.
#
# The other two binaries (`agentkeeper-mcp`, `ak-scan`) live in the
# `agentkeeper-core` crate, which has no Tauri dependency. Keeping them here
# would mean one crate, one dependency graph, one fat-LTO pass per binary:
# the two headless CLIs would link a WebView stack they never call, and each
# of them would pay a full cross-crate optimisation the GUI alone needs.
default-run = "agentkeeper-shell"

[lib]
name = "agentkeeper_shell_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# The asset core: scanning, validation, the store, the MCP server. It has no
# Tauri dependency, so the headless binaries built from it stay small and link
# fast. `lib.rs` re-exports it as `pub mod core`, so `core::…` paths — and the
# integration tests' `agentkeeper_shell_lib::core::…` — read exactly as before.
agentkeeper-core = { path = "../core" }
# The shell itself only serialises command payloads. Everything else — the
# scanner, the store, the YAML/TOML frontmatter, the HTTP client, DPAPI — is
# the core's business, and the core owns those dependencies.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# The release / dev / test profiles live in the workspace root
# (`tauri-shell/Cargo.toml`). A `[profile.*]` table only applies to the
# package that declares it, so keeping them here would have left the core
# crate's binaries on cargo's defaults — unoptimised and unstripped, shipped
# 50% larger.
